<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>AudioCast Receiver Test</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<audio id="audio" autoplay></audio>
<script>
// Development receiver: serve on the LAN and register only test speakers.
const audio = document.getElementById('audio');
const context = cast.framework.CastReceiverContext.getInstance();
const playback = new cast.framework.PlaybackConfig();
playback.autoPauseDuration = 0.5;
playback.autoResumeDuration = 2;
playback.autoResumeNumberOfSegments = 2;
const started = performance.now();
function report(event) {
  const data = {
    event, elapsed: ((performance.now() - started) / 1000).toFixed(3),
    position: audio.currentTime, paused: audio.paused, readyState: audio.readyState,
    buffered: Array.from({length: audio.buffered.length}, (_, i) =>
      [audio.buffered.start(i), audio.buffered.end(i)]),
    error: audio.error ? audio.error.code : null
  };
  console.log('AudioCast', JSON.stringify(data));
}
['loadstart', 'loadedmetadata', 'canplay', 'playing', 'waiting', 'stalled',
 'pause', 'ended', 'error', 'seeking', 'seeked'].forEach(event =>
  audio.addEventListener(event, () => report(event)));
setInterval(() => { if (audio.readyState) report('heartbeat'); }, 2000);
context.start({mediaElement: audio, playbackConfig: playback,
  useShakaForHls: false, versionCode: 2});
report('receiver-ready');
</script>
</html>
